<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>疾患・徴候トレーニング</title>
<style>
:root{color-scheme:light;--ink:#171717;--muted:#707070;--line:#dedede;--paper:#f7f7f7;--card:#fff;--soft:#ededed}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:#171717;color:white;padding:20px 18px 18px;text-align:center}
header h1{font-size:20px;letter-spacing:.04em;margin:0 0 5px}
header p{font-size:12px;color:#c8c8c8;margin:0}
main{width:min(760px,100%);margin:0 auto;padding:16px 14px calc(34px + env(safe-area-inset-bottom))}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,select{font:inherit}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode button,.toolbar button,.nav button,.action button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 10px;font-size:14px}
.mode button.active{background:#171717;color:white;border-color:#171717}
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:0 2px 8px}
.track{height:5px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin-bottom:14px}
.track span{display:block;height:100%;background:#222;width:0;transition:width .2s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:0 3px 12px #00000008}
.kicker{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.question{font-size:clamp(20px,5vw,27px);font-weight:750;line-height:1.45;overflow-wrap:anywhere;margin:0 0 16px}
.clues{display:grid;gap:9px}
.clue{display:flex;align-items:stretch;gap:10px;width:100%;text-align:left;border:1px solid #d9d9d9;background:#fff;border-radius:12px;padding:0;min-height:52px;overflow:hidden;color:#171717}
.clue .num{display:flex;align-items:center;justify-content:center;flex:0 0 42px;background:#efefef;border-right:1px solid #ddd;font-size:14px;font-weight:700}
.clue .content{display:flex;align-items:center;padding:12px 12px 12px 0;min-width:0;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.clue.hidden .content{color:transparent;user-select:none}
.clue.hidden .num{background:var(--mask,#efefef);color:#171717}
.clue.revealed{border-color:#aaa}
.clue:focus-visible,button:focus-visible{outline:3px solid #777;outline-offset:2px}
.answer{margin-top:14px;padding:14px;border:1px solid #aaa;border-radius:12px;background:#f1f1f1;display:none}
.answer.show{display:block}
.answer .label{font-size:11px;color:#666;margin-bottom:5px}
.answer .value{font-size:20px;font-weight:750;line-height:1.4}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:13px 0 0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.nav button{padding:13px 8px;font-weight:650}
.action{display:flex;gap:8px;margin-top:9px}
.action button{flex:1;font-size:13px}
button:active{transform:scale(.99)}
.footer{font-size:11px;color:#888;text-align:center;margin:20px 0 0}
@media(min-width:600px){main{padding-top:22px}.panel{padding:24px}.clue .content{font-size:16px}}
</style>
</head>

<header><h1>疾患・徴候トレーニング</h1><p>タップして開示する反復学習アプリ</p></header>

  <div class="nav">

    <button id="next" type="button">次の問題 →</button>

  <div class="action">

  <div class="action">

  <p class="footer" id="total"></p>
</main>

let mode = 0, order = DATA.map((_,i)=>i), pos = 0, clueOrder = [], opened = new Set(), answerShown = false;
const $ = id => document.getElementById(id);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function current(){return DATA[order[pos]];}
function setupClues(){clueOrder=shuffle(current().clues.map((_,i)=>i));opened=new Set();answerShown=false;render();}
function render(){
 const d=current();
 $('count').textContent=(pos+1)+' / '+order.length;
 $('kicker').textContent=mode===0?'DISEASE':'CLUES';
 $('question').textContent=mode===0?d.disease:'徴候から疾患名を考えよう';
 $('clues').innerHTML='';
 clueOrder.forEach((idx,n)=>{
   const clue=d.clues[idx], isOpen=opened.has(idx);
   const btn=document.createElement('button');
   btn.type='button';btn.className='clue '+(isOpen?'revealed':'hidden');
   if(!isOpen && clue.color) btn.style.setProperty('--mask',clue.color);
   const num=document.createElement('span');num.className='num';num.textContent=String(n+1);
   const content=document.createElement('span');content.className='content';content.textContent=clue.text;
   btn.append(num,content);
   btn.addEventListener('click',()=>{if(opened.has(idx))opened.delete(idx);else opened.add(idx);render();});
   $('clues').appendChild(btn);
 });
 $('answerValue').textContent=d.disease;
 $('answer').classList.toggle('show',mode===1 && answerShown);
 $('showAnswer').style.display=mode===1?'block':'none';
 $('showAnswer').textContent=answerShown?'疾患名を隠す':'疾患名を表示';
 $('hint').textContent=mode===0?'番号をタップすると徴候が開示されます':'徴候をタップして確認し、「疾患名を表示」を押してください';
 $('revealedCount').textContent=opened.size+' / '+d.clues.length+' 開示';
 $('bar').style.width=(opened.size/Math.max(1,d.clues.length)*100)+'%';
 $('modeA').classList.toggle('active',mode===0);$('modeB').classList.toggle('active',mode===1);
 $('total').textContent=DATA.length+' 疾患・'+DATA.reduce((s,x)=>s+x.clues.length,0)+' 徴候を収録';
}
$('modeA').onclick=()=>{mode=0;setupClues();};
$('modeB').onclick=()=>{mode=1;setupClues();};
$('prev').onclick=()=>{pos=(pos-1+order.length)%order.length;setupClues();};
$('next').onclick=()=>{pos=(pos+1)%order.length;setupClues();};
$('shuffle').onclick=()=>{order=shuffle(order);pos=0;setupClues();};
$('reshuffleClues').onclick=()=>{clueOrder=shuffle(clueOrder);render();};
$('revealAll').onclick=()=>{opened=new Set(current().clues.map((_,i)=>i));if(mode===1)answerShown=true;render();};
$('showAnswer').onclick=()=>{answerShown=!answerShown;render();};
setupClues();
